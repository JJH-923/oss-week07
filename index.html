<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>레시피</title>
  <!-- P2: 여기에 style.css 를 연결합니다 -->
</head>
<body>
  <h1>봉골레 파스타</h1>
  <p>바지락의 <strong>짭조름한 바다 향</strong>을 마늘과 화이트와인으로 살린 <em>이탈리아식</em> 파스타.</p>
  <img src="images/vongole.jpg" alt="맛있는 스파게티 한 접시" width="480">
  <h2>정보</h2>
<table>
  <tr><th>분량</th><th>시간</th><th>난이도</th></tr>
  <tr><td>2인분</td><td>25분</td><td>보통</td></tr>
</table>
<h2>재료</h2>
<ul>
  <li>스파게티 200g</li>
  <li>해감한 바지락 400g</li>
  <li>마늘 4쪽</li>
  <li>페페론치노 2개</li>
  <li>화이트와인 50ml</li>
  <li>올리브유 4큰술</li>
  <li>이탈리안 파슬리 한 줌 </li>
  <li>소금 조금</li>
</ul>
<h2>만드는 순서</h2>
<ol>
  <li>바지락을 소금물에 담가 해감하고 껍데기끼리 비벼 씻는다.</li>
  <li>끓는 소금물에 스파게티를 넣고 포장지에 적힌 시간보다 1분 짧게 삶는다.</li>
</ol>
</body>
</html>
